name: Temida
options:
  bundleIdPrefix: com.nulljosh
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.38.0"
packages:
  SwiftLint:
    url: https://github.com/realm/SwiftLint
    from: 0.59.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "202610191430"
    # Universal: iPad was never excluded for a design reason, only never enabled.
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: QMM486NPYC
targets:
  Temida:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: ../Temida.icon
        buildPhase: resources
      - path: ../web/fonts/TemidaSerif-Semibold.ttf
        buildPhase: resources
    entitlements:
      path: Temida.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.brief
        ASSETCATALOG_COMPILER_APPICON_NAME: Temida
    info:
      path: Sources/Info.plist
      properties:
        UIAppFonts: ["TemidaSerif-Semibold.ttf"]
        # INFOPLIST_KEY_ build settings never reach this hand-made plist, so every key lives here.
        CFBundleDisplayName: Temida
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageName: LaunchLogo
        CFBundleLocalizations: [en, fr, es, zh-Hans, zh-Hant, pa]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSFaceIDUsageDescription: "Temida uses Face ID to protect your case data."
        ITSAppUsesNonExemptEncryption: false
        NSRemindersFullAccessUsageDescription: "Temida adds the next steps you choose to Reminders."
        NSCalendarsWriteOnlyAccessUsageDescription: "Temida adds the next steps you choose to your calendar."
        CFBundleURLTypes:
          - CFBundleURLName: com.nulljosh.brief
            CFBundleURLSchemes:
              - litigate
